<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Love - Hashan Sir</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon: #00f0ff; --gold: #ffd700; --bg: #090d16; }
        body { background: radial-gradient(circle, #1a2a44, #000); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .game-card { background: rgba(20, 30, 50, 0.9); border: 2px solid var(--neon); border-radius: 20px; padding: 20px; width: 100%; max-width: 450px; box-shadow: 0 0 25px rgba(0, 240, 255, 0.2); }
        .equation { font-size: 24px; color: var(--gold); margin: 20px 0; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--neon); background: #000; color: white; }
        button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-start { background: var(--neon); color: #000; }
        .btn-correct { background: #2ed573; color: white; }
        .btn-wrong { background: #ff4757; color: white; }
        .hidden { display: none; }
        .leaderboard-item { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 5px 0; }
    </style>
</head>
<body>

<div class="game-card">
    <h2 style="color:var(--neon); text-align:center;">Maths Love Challenge</h2>
    
    <!-- Leaderboard -->
    <div id="leader-screen">
        <h3>🏆 අද දින ශූරයෝ</h3>
        <div id="leaderboard-list"></div>
        <button class="btn-start" onclick="nextScreen('info-screen')">Game එක පටන් ගන්න 🚀</button>
    </div>

    <!-- User Info -->
    <div id="info-screen" class="hidden">
        <input type="text" id="u-name" placeholder="ඔයාගේ නම">
        <button class="btn-start" onclick="saveUser()">සෙල්ලම් කරන්න පටන් ගන්න</button>
    </div>

    <!-- Play Screen -->
    <div id="play-screen" class="hidden">
        <div id="equation" class="equation">...</div>
        <button class="btn-correct" onclick="check(true)">TRUE ✔</button>
        <button class="btn-wrong" onclick="check(false)">FALSE ✖</button>
    </div>
</div>

<script>
    const supabase = supabase.createClient('https://olbtmrccdghenxtzslgx.supabase.co', 'sb_publishable_rsPQaFPm5F5RGmTqht7e7g_x6_KkiYa');
    let userName = "", score = 0, currentCorrect = true;

    async function loadLeaderboard() {
        const today = new Date().toISOString().split('T')[0];
        const { data } = await supabase.from('leaderboard').select('*').gte('created_at', today).order('score', { ascending: false });
        document.getElementById('leaderboard-list').innerHTML = (data || []).map(i => 
            `<div class="leaderboard-item"><span>${i.name}</span><span>${i.score} pts</span></div>`).join('');
    }

    function saveUser() {
        userName = document.getElementById('u-name').value;
        if(userName) nextScreen('play-screen'), generate();
    }

    function generate() {
        let n1 = Math.floor(Math.random()*20), n2 = Math.floor(Math.random()*20);
        let ans = n1 + n2;
        currentCorrect = Math.random() > 0.5;
        document.getElementById('equation').innerText = `${n1} + ${n2} = ${currentCorrect ? ans : ans+1}`;
    }

    async function check(val) {
        if(val === currentCorrect) {
            score++;
            generate();
        } else {
            // Game Over & Update Logic
            const { data: existing } = await supabase.from('leaderboard').select('id, score').eq('name', userName).single();
            if(existing && score > existing.score) await supabase.from('leaderboard').update({score}).eq('id', existing.id);
            else if(!existing) await supabase.from('leaderboard').insert([{name: userName, score}]);
            alert("Game Over! ඔයාගේ ලකුණු: " + score);
            location.reload();
        }
    }

    function nextScreen(id) {
        document.querySelectorAll('.game-card > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    loadLeaderboard();
</script>
</body>
</html>
